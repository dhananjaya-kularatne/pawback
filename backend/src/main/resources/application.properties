spring.application.name=pawback
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawback?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.tomcat.threads.max=20
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
server.forward-headers-strategy=none
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# OAuth2 Settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
app.oauth2.authorizedRedirectUris=${OAUTH_REDIRECT_URI:${app.frontend-url}/oauth2/redirect}
app.report-limit.trusted-proxies=${TRUSTED_PROXY_IPS:}
app.report-limit.client=${REPORT_CLIENT_LIMIT:5}
app.report-limit.pet=${REPORT_PET_LIMIT:20}
app.report-limit.window-minutes=${REPORT_WINDOW_MINUTES:60}

# Security Rate Limiting
app.security.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
app.security.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

# Temporary OAuth state only; API authentication remains JWT-based.
server.servlet.session.timeout=3m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Mail settings: PawBack-specific variables preserve other projects' API keys.
app.mail.api-key=${PAWBACK_BREVO_API_KEY:}
app.mail.sender-email=${PAWBACK_BREVO_SENDER_EMAIL:}
app.mail.sender-name=${PAWBACK_BREVO_SENDER_NAME:PawBack}
